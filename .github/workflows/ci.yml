name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      # 单元与集成测试不需要屏幕录制 / 辅助功能权限：
      # 平台调用全部封装在薄适配层之后，测试走合成实现，
      # 因此可在无 GUI 的 CI 环境完整验证协议、状态机与调度语义。
      - name: Test
        run: swift test

      # 四进程隔离场景矩阵。
      #
      # **不作为硬门禁**：其中若干场景依赖真实 GUI 会话、屏幕录制/辅助功能权限
      # 与目标应用的窗口服务器行为，在托管 runner 上的表现与真机不同
      # （实测 runner 上会拒绝窗口缩放，本地正常）。这类场景属于真机验证范畴。
      #
      # 硬门禁是上面的 `swift test`：254 项确定性测试覆盖协议、状态机、
      # 弱网矩阵与恢复语义，不依赖图形会话与权限。
      # 场景矩阵仍然执行并产出报告，供人工查看与下载。
      - name: Multi-process scenario matrix
        run: |
          .build/debug/m2mctl scenarios
          .build/debug/m2mctl selftest --report docs/reports/automated-test-report.md
        continue-on-error: true

      # 性能基线。单机注入链路条件，本地交互项必须与网络无关。
      - name: Performance baseline
        run: .build/debug/m2mctl perf --report docs/reports/performance-baseline.md

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-test-report
          path: docs/reports/
          if-no-files-found: ignore
